name: "e2e"
on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: "00 07 * * *"
jobs:
  test-e2e:
    name: Run E2E tests
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '14'
      - name: Sync dependencies
        run: npm install
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run your tests
        run: npx playwright test 'tests/02.fixture.spec.ts'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: test-results
